name: CI

on:
  # Branches only: a release tag points at a commit that was checked on its branch.
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the running checks of the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: ruff check app
        working-directory: backend
      # The migration check first, so a schema drift shows on its own.
      - run: python -m pytest tests/test_schema.py
        working-directory: backend
      - run: python -m pytest -n auto --durations=20
        working-directory: backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run test:sdk
        working-directory: frontend

  generated-api:
    name: Generated API types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m app.scripts.export_openapi ../frontend/openapi.json
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run gen:api
        working-directory: frontend
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts
