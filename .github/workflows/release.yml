name: Release

# Publishes the GitHub Release of a version tag, with that version's CHANGELOG section as its notes. The update notice
# of a running YAAP and the release scripts read it through GitHub's public API, so no personal token is involved.
on:
  push:
    tags: ["v*.*.*"]
  # For a tag pushed before this workflow existed: Actions › Release › Run workflow, with one or more tags.
  workflow_dispatch:
    inputs:
      tags:
        description: "Existing tags to publish a Release for, separated by spaces (for example: v0.7.0 v0.8.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tags }}

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAGS: ${{ github.event_name == 'push' && github.ref_name || inputs.tags }}
      # Only a newly pushed tag becomes the latest Release; an older tag published afterwards does not take its place.
      LATEST: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # The notes come from the CHANGELOG of this checkout; set_version needs only the standard library.
      - name: Publish the Release of each tag
        working-directory: backend
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$tag' is not a release tag like v1.2.3."; exit 1
            fi
            # A Release that exists (perhaps written by hand) is left as it is.
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "The Release of $tag exists already; left unchanged."
              continue
            fi
            version="${tag#v}"
            notes="$RUNNER_TEMP/notes-$version.md"
            python -m app.scripts.set_version --section "$version" > "$notes"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --latest="$LATEST" \
              --title "YAAP $version" --notes-file "$notes"
            echo "Published the Release of $tag."
          done
