# sshd settings of a YAAP sandbox: only the user yaap, only with the key YAAP gave the container, only the host key
# YAAP made (and pinned). Debian reads this folder before its own settings, so these win.
HostKey /etc/ssh/ssh_host_ed25519_key
AllowUsers yaap
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
# Local forwarding to localhost only: the preview (YAAP_PREVIEW_PORT) reaches a dev server in the runner or sandbox
# over this connection. Nothing else can be opened through it, and nothing can listen through it.
AllowTcpForwarding local
PermitOpen localhost:* 127.0.0.1:* [::1]:*
PermitListen none
AllowAgentForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
X11Forwarding no
PermitUserEnvironment no
PrintMotd no
