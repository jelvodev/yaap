# Personal Docker settings for this computer. Copy this file to docker-compose.override.yml (which git ignores) and
# keep only what you need; Docker Compose merges it with docker-compose.yml by itself.

services:
  yaap:
    volumes:
      # A backup destination (Settings › System › Backup, kind Folder, path /backup): a folder of this
      # computer, preferably on another disk than the data folder. On Windows, for example:
      - D:/Backups/YAAP:/backup
      # On macOS or Linux, for example:
      # - /Volumes/External/YAAP:/backup

    # The master key as a Docker secret instead of in .env (see docs/configuration.md, "The master key"):
    # environment:
    #   YAAP_MASTER_KEY_FILE: /run/secrets/yaap_master_key
    # secrets:
    #   - yaap_master_key

  # Extra packages for the runners and sandboxes (docs/configuration.md, "Extra packages for the runner"): one extra
  # layer on the published runner image, made into an image of its own that the helper uses instead. Build it with
  # docker compose up -d --build; each runner is made again from the new image on its next use. Set BASE to the
  # runner image that docker-compose.yml names (the same version), and change it when you update YAAP.
  # sandbox-image:
  #   build:
  #     context: docker/sandbox
  #     dockerfile: Dockerfile.extra
  #     args:
  #       BASE: ghcr.io/jelvodev/yaap-sandbox:0.8.0
  #       EXTRA_APT_PACKAGES: "postgresql-client default-jdk-headless"
  #       EXTRA_SETUP: "npm install --global pnpm@10"
  #     labels:
  #       dev.yaap: "true"
  #   image: yaap-sandbox-extra:local
  #   entrypoint: ["true"]
  #   network_mode: none
  #   restart: "no"
  # yaap-sandbox:
  #   environment:
  #     YAAP_SANDBOX_IMAGE: yaap-sandbox-extra:local
  #
  # When you build YAAP's images yourself (docker-compose.build.yml), give the existing sandbox-image service the two
  # build arguments instead:
  # sandbox-image:
  #   build:
  #     args:
  #       EXTRA_APT_PACKAGES: "postgresql-client default-jdk-headless"
  #       EXTRA_SETUP: "npm install --global pnpm@10"

# secrets:
#   yaap_master_key:
#     file: ./master-key.txt
