[project]
name = "yaap-backend"
version = "0.8.1"
description = "Backend of YAAP, a personal, self-hosted, model-agnostic AI development environment."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# A small set that the whole tree passes today, so CI stays green and every rule only ratchets:
# PGH003/PGH004 refuse a bare `type: ignore` or `noqa` (each names its rule; the reason after it is a review rule),
# ANN0/ANN2 require parameter and return annotations on every function (ANN401 is left out: `Any` is allowed where
# a value really is untyped), E501 keeps lines at 120 columns.
select = ["PGH003", "PGH004", "ANN0", "ANN2", "E501"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
# Files that still had lines over 120 columns when E501 was turned on. Long lines are fixed only in code a change
# touches; a file leaves this list once it is clean, and new files are never added.
